name: solid-print
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solidprint
      POSTGRES_USER: solidprint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidprint"]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["s3-data:/data"]
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]
  clamav:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:53310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
  app:
    profiles: ["production"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://solidprint:${POSTGRES_PASSWORD}@postgres:5432/solidprint
      S3_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    profiles: ["production"]
    build: .
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://solidprint:${POSTGRES_PASSWORD}@postgres:5432/solidprint
      S3_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["backups-data:/app/.data/backups"]
volumes:
  postgres-data:
  s3-data:
  clamav-data:
  backups-data:
